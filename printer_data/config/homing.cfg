# Note you may need to add the following to your printer.cfg somewhere (without the comments of course) for the Kinematic position stuff below to work.
#[force_move]
#enable_force_move: True

[gcode_macro SMARTHOME]
gcode:
    {% set requested = params.AXES|default("XYZ")|string %}
    {% set n = namespace(homeaxes = []) %}
    {% for axis in ["X", "Y", "Z"] %}
      {% if axis.lower() not in printer.toolhead.homed_axes and axis in requested %}
          {% if n.homeaxes.append(axis) %}
          {% endif %}
      {% endif %}
    {% endfor %}

    {% if n.homeaxes|length > 0 %}
      RESPOND MSG={"HOMING:%s" % ("".join(n.homeaxes))}
      G28 {" ".join(n.homeaxes)}
    {% endif %}

[gcode_macro _HOME_X]
gcode:
    # Home
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.49 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
    
    SET_KINEMATIC_POSITION X=15
    G91
    G1 X-3 F1200
    
    #G4 P2000
    #M400 to finish all pending moves/process the buffer
    M400 
    G28 X
    
    # Move away
    # G91
    # G1 X-10 F1200
    
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.49 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
    
    SET_KINEMATIC_POSITION Y=15
    G91
    G1 Y-3 F1200
    
    #G4 P2000
    #M400 to finish all pending moves/process the buffer
    M400 
    
    # Home
    G28 Y
    # Move away
    # G91
    # G1 Y-10 F1200

    # Wait just a second… (give StallGuard registers time to clear)
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    
[gcode_macro _HOME_Z]
gcode:
    G90
    G28 Z
    G1 Z30

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # SET_KINEMATIC_POSITION Z=1
  # G1 Z4 F1200

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}

  {% if home_all or ('X' in params and 'Y' in params) %}
    G90
    G1 X60 Y60 F3600
  {% endif %}
  
  {% if home_all or 'Z' in params %}
    G28 Z
    G90
    G1 Z60 F1500
  {% endif %}

  # make a list of everything not in params to be set as not homed
  {% set n = namespace(reset = []) %}
  {% for axis in ["X", "Y", "Z"] %}
    {% if axis.lower() not in printer.toolhead.homed_axes and axis not in params %}
        {% if n.reset.append(axis) %}
        {% endif %}
    {% endif %}
  {% endfor %}
  {% if not home_all %}
      SET_KINEMATIC_POSITION CLEAR={"".join(n.reset)}
  {% endif %}
