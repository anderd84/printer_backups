[gcode_macro _Light_Variables]
variable_sleep_enabled: False
gcode:

[gcode_macro SET_DISPLAY_LED]
gcode:
    {% set r = params.R|default(printer['neopixel display_led'].color_data[0][0])|float %}
    {% set g = params.G|default(printer['neopixel display_led'].color_data[0][1])|float %}
    {% set b = params.B|default(printer['neopixel display_led'].color_data[0][2])|float %}

    SET_LED LED=display_led RED={r} GREEN={g} BLUE={b} SYNC=0 TRANSMIT=1

[gcode_macro SET_CHAMBER_LED]
gcode:
    {% set r = params.R|default(printer['neopixel chamber_color'].color_data[0][0])|float %}
    {% set g = params.G|default(printer['neopixel chamber_color'].color_data[0][1])|float %}
    {% set b = params.B|default(printer['neopixel chamber_color'].color_data[0][2])|float %}
    {% set w = params.W|default(printer['led chamber_white'].color_data[0][3])|float %}

    SET_LED LED=chamber_color RED={r} GREEN={g} BLUE={b} SYNC=0 TRANSMIT=1
    SET_LED LED=chamber_white WHITE={w} SYNC=0 TRANSMIT=1

[gcode_macro ENABLE_SLEEP]
gcode:
    SET_DISPLAY_LED R=0 G=0 B=0
    SET_CHAMBER_LED R=0 G=0 B=0 W=0

    SET_DISPLAY_GROUP GROUP=_blank_display

    SET_GCODE_VARIABLE MACRO=_Light_Variables VARIABLE=sleep_enabled VALUE={ True }

[gcode_macro DISABLE_SLEEP]
gcode:
    {% set displayLED = printer.configfile.settings["neopixel display_led"] %}
    {% set chamberColor = printer.configfile.settings["neopixel chamber_color"] %}
    {% set chamberWhite = printer.configfile.settings["led chamber_white"] %}
    SET_DISPLAY_LED R={displayLED.initial_red} G={displayLED.initial_green} B={displayLED.initial_blue}
    SET_CHAMBER_LED R={chamberColor.initial_red} G={chamberColor.initial_green} B={chamberColor.initial_blue} W={chamberWhite.initial_white}

    SET_DISPLAY_GROUP GROUP=_default_16x4

    SET_GCODE_VARIABLE MACRO=_Light_Variables VARIABLE=sleep_enabled VALUE={ False }