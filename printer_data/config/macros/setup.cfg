[gcode_macro _setup_globals]
variable_filament_sensor_enabled: 1 # NOTE Enable(1) or disable(0) the filament sensor, if one is connected
variable_bed_temp_over: 10 # NOTE Start print if bed temperature is over by this amount, otherwise wait for temperature drop
gcode:
    # Don't delete this section

[gcode_macro SHUTDOWN]
gcode:
	{action_call_remote_method("shutdown_machine")}   ; Moonraker compatible host shutdown

[gcode_macro PREHEAT_CHAMBER]
gcode:
    {% set chamberTemp = params.TEMP|default(35)|int %}
    {% set bedTemp = params.BED_TARGET|default(95)|int %}

    M140 S{(bedTemp, 75)|min}

    RESPOND MSG="Heat soaking to {chamberTemp} deg C"
	MR_NOTIFY TITLE="$printer_name - Chamber Preheat" MESSAGE="Heat soaking to {chamberTemp} deg C"

    SMARTHOME AXES=Z
    
    M106 S255                                         # Turn on the PT-fan
    SET_FAN_SPEED FAN=air_scrub SPEED=1
    SET_FAN_SPEED FAN=bed_fan SPEED=1
    G0 Z100 F3600

    {% if printer["heater_bed"].temperature < 75 %}
      M190 S{(bedTemp, 75)|min}
    {% endif %}
    
    SET_FAN_SPEED FAN=bed_fan SPEED=0.1

    M190 S{bedTemp}
    
    SET_FAN_SPEED FAN=bed_fan SPEED=0.20
    # G4 P120000 # wait 5 minutes for temps to stabilize
    
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={chamberTemp} # wait for chamber to warm

	RESPOND MSG="Minimum temp reached, stabilizing"
	MR_NOTIFY TITLE="$printer_name - Chamber Preheat" MESSAGE="Minimum chamber temp reached. Stabilizing"

    M107                                                # Turn off partcooling fan
    SET_FAN_SPEED FAN=air_scrub SPEED=0.00
    SET_FAN_SPEED FAN=bed_fan SPEED=0.00

    G4 P300000 # wait 5 minutes for temps to stabilize
    
    G0 Z60 F3600
    RESPOND MSG="Done!"
    MR_NOTIFY TITLE="$printer_name - Chamber Preheat" MESSAGE="Done!"

    
    
[gcode_macro PRINT_START]
gcode:
    SET_VELOCITY_LIMIT ACCEL=500
    # Parameters
    {% set bedtemp = params.BED|int %}
    {% set hotendtemp = params.EXTRUDER|int %}
    {% set chambertemp = params.CHAMBER|default(0)|int %}
    {% set bedType = params.BTYPE|default("Textured PEI Plate")|string %}
    {% set manualZ_Offset = params.Z_OFFSET|default(0.0)|float %}
    
    {% set disableAdaptiveMeshStr = params.NO_MESH|default("false")|string %}
    {% set disableAdaptiveMesh = true if disableAdaptiveMeshStr in ['True', 'true', '1', 'ON', 'on'] else false %}
    
    # Other variables
    {% set bedtempSlicer = bedtemp %}
    {% set bedtempOver = printer["gcode_macro _setup_globals"].bed_temp_over|default(0)|int %}
    {% set maxVelocity = 200|int %}
    {% set maxVelocityAdjusted =  (0.90 * maxVelocity * 60)|int %}

    {% if printer.configfile.settings.safe_z_home %}
        {% set startX = printer.configfile.settings.safe_z_home.home_xy_position[0]|float %}
        {% set startY = printer.configfile.settings.safe_z_home.home_xy_position[1]|float %}
    {% endif %}

    {% set bedtempAlmost = ((bedtemp - 2, 0, printer.heater_bed.temperature|int)|max, bedtemp)|max %}
    {% set hotendtempStepOne = ((hotendtemp, printer[printer.toolhead.extruder].temperature|int)|min, 150)|max %}
    {% set hotendtempStepTwo = ((hotendtemp, printer[printer.toolhead.extruder].temperature|int)|min, 170)|max %}

    # If bed-temp-almost is higher than bed-temp by a maximum of bed-temp-over
    {% if bedtempAlmost > bedtemp %}
        {% if (bedtempAlmost - bedtempOver) <= bedtemp %}
            {% set bedtemp = bedtempAlmost %}
        {% endif %}
    {% endif %}

    G90                                                  ; absolute positioning
    M140 S{bedtempAlmost}                                ; set & don't wait for bed temp
    {% if chambertemp > 0 %}
        PREHEAT_CHAMBER TEMP={chamberTemp} BED_TARGET={bedtempAlmost}
    {% else %}
        RESPOND MSG="No heat soak."  
    {% endif %}
    M104 S{hotendtempStepOne}                            ; set & don't wait for hotend temp
    SMARTHOME AXES=XY
    G1 X60 Y60 F{maxVelocityAdjusted}

    M190 S{bedtempAlmost}                                ; set & wait for bed temp

    M190 S{bedtemp}                                      ; set & wait for bed temp
    M140 S{bedtempSlicer}                                ; set & don't wait for bed temp ; set temp to sliced setting regardless

    G28 Z

    {% set z_adjust = manualZ_Offset %}
    {% if bedType=="High Temp Plate" %}
        {% set z_adjust = z_adjust + 0 %}
    {% else %}
        {% set z_adjust = z_adjust - 0.03 %}
    {% endif %}
    SET_GCODE_OFFSET Z={z_adjust} MOVE=1
    {% if not disableAdaptiveMesh %}
        BED_MESH_CALIBRATE ADAPTIVE=1
        SET_VELOCITY_LIMIT ACCEL=500
    {% endif %}

    M104 S{hotendtemp}
    SMART_PARK

    M109 S{hotendtemp}                                   ; set & wait for hotend temp

    {% if bedtemp > 90 %}
        RESPOND MSG="Activating air filter"
        SET_FAN_SPEED FAN=air_scrub SPEED=0.70           ; use air filtration if using abs/asa
    {% endif %}

    LINE_PURGE_B
 
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-1.0 F3600                 ; retract filament
    G91                            ; relative positioning

    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 20) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    SET_VELOCITY_LIMIT ACCEL=500

    G0 Z{z_safe} F3600             ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G90                            ; absolute positioning
    G0 X60 Y{max_y-30} F3600          ; park nozzle at rear
    
[gcode_macro LINE_PURGE_B]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    # Get relevant printer params
    {% set travel_speed = (printer.toolhead.max_velocity) * 60 | float %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}
    
    # Use firmware retraction if it is defined
    {% if printer.firmware_retraction is defined %}
        {% set RETRACT = G10 | string %}
        {% set UNRETRACT = G11 | string %}
    {% else %}
        {% set RETRACT = 'G1 E-.5 F2100' | string %}
        {% set UNRETRACT = 'G1 E.5 F2100' | string %}
    {% endif %}

    # Get purge settings from _Kamp_Settings
    {% set verbose_enable = printer["gcode_macro _KAMP_Settings"].verbose_enable | abs %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
    {% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    {% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}


    # Calculate purge origins and centers from objects
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    # Get all object points
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on X axis
    {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on Y axis

    {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}                                  # Add margin to x min, compare to 0, and choose the larger
    {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}                                  # Add margin to y min, compare to 0, and choose the larger

    # Calculate purge speed
    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if cross_section < 5 %}

        {action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}

    {% else %}

        {% if verbose_enable == True %}

        {action_respond_info("Moving filament tip {}mms".format(                                                                 
            (tip_distance),                                                                                      
        )) }
        {% endif %}

        {% if printer.firmware_retraction is defined %}
            {action_respond_info("KAMP purge is using firmware retraction.")}
        {% else %}
            {action_respond_info("KAMP purge is not using firmware retraction, it is recommended to configure it.")}
        {% endif %}

        {% if purge_y_origin > 0 %}
        
            {action_respond_info("KAMP purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_center),
                (purge_y_origin),
                (purge_amount),
                (flow_rate),
            )) }
    
        {% else %}
    
            {action_respond_info("KAMP purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_origin),
                (purge_y_center),
                (purge_amount),
                (flow_rate),
            )) }

        {% endif %}

        SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

        G92 E0                                                                              # Reset extruder
        G0 F{travel_speed}                                                                  # Set travel speed
        G90                                                                                 # Absolute positioning
        G0 X{purge_x_center} Y{purge_y_origin}                                              # Move to purge position
        G0 Z{purge_height}                                                                  # Move to purge Z height
        M83                                                                                 # Relative extrusion mode
        G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
        G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
        {RETRACT}                                                                           # Retract
        G0 X{purge_x_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
        G92 E0                                                                              # Reset extruder distance
        M82                                                                                 # Absolute extrusion mode
        G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

        RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
    
    {% endif %}