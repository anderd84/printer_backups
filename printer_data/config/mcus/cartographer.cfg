[mcu cartographer]
canbus_uuid: 2ce2a4d3036b

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 21.9
verbose: no # For extra output

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[bed_mesh]
zero_reference_position: 125, 125 # The centre of your bed.
speed: 300
horizontal_move_z: 3
mesh_min: 10, 32 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 240, 240 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough


[adxl345]
# Keep ONE cs_pin line for your probe version.
# The wrong pin causes an endless boot loop.
# cs_pin: cartographer:PA3   # Cartographer V3
cs_pin: cartographer:PA0  # Cartographer V4 - use this line instead of the one above
spi_bus: spi1
axes_map: y, -x, z

[resonance_tester]
accel_chip: adxl345
probe_points:
    125, 125, 20 # Fill out the blank with x and y coordinates where you want to run the resonance test.
sweeping_period: 0