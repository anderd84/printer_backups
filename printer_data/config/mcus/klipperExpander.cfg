[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_11001200115330374E333320-if00
restart_method: command

# [output_pin mosfet1]
# pin: expander:PA1
# pwm: true
# cycle_time: 0.010
# value: 0
# shutdown_value: 0

# [output_pin mosfet2]
# pin: expander:PA2
# pwm: true
# cycle_time: 0.010
# value: 0
# shutdown_value: 0

# [output_pin mosfet3]
# pin: expander:PA3
# pwm: true
# cycle_time: 0.010
# value: 0
# shutdown_value: 0

# Status LED lights when klipper connects 
[static_digital_output onboardLED]
pins: !expander:PA4

[neopixel chamber_color]
pin: expander:PB1
color_order: BRG
chain_count: 4
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

[led chamber_white]
white_pin: expander:PA0
cycle_time: 0.010
initial_WHITE: 0.5

[fan_generic bed_fan]
pin: expander:PA1
max_power: 1.0
kick_start_time: 0.5                                              # Depending on your fan, you may need to increase this value if your fan will not start
off_below: 0.13
cycle_time: 0.010

[fan_generic air_scrub]
pin: expander:PA2
max_power: 1.0
kick_start_time: 0.5                                              # Depending on your fan, you may need to increase this value if your fan will not start
off_below: 0.13
cycle_time: 0.010

[temperature_sensor chamber]
# sensor_type: NTC 100K MGB18-104F39050L32
sensor_type: Generic 3950
# sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: expander:PA6
min_temp: 0
max_temp: 100
gcode_id: C

# Other Pins
# T0 = expander:PA6
# T1 = expander:PA5
# GPIO = expander:PA7
