[mcu toolhead]
canbus_uuid: 41c4d81be523

[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: toolhead:gpio28

# [adxl345]
# cs_pin: EBBCan:gpio1
# spi_software_sclk_pin: EBBCan:gpio2
# spi_software_mosi_pin: EBBCan:gpio0
# spi_software_miso_pin: EBBCan:gpio3
# axes_map: z,-y,x

# [resonance_tester]
# probe_points: 100, 100, 20
# accel_chip: adxl345

[extruder]
step_pin: toolhead:gpio18
dir_pin: toolhead:gpio19
enable_pin: !toolhead:gpio17
microsteps: 16
rotation_distance: 22.7263526912
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: toolhead:gpio7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: toolhead:gpio27
smooth_time: 2.0 #   A time value (in seconds) over which temperature measurements will be smoothed to reduce the impact of measurement noise. The default #   is 1 seconds.
control: pid
pid_Kp: 10.809
pid_Ki: 2.184
pid_Kd: 35.312
min_temp: 0
max_temp: 290
pressure_advance: 0.0                                               # See tuning pressure advance doc
pressure_advance_smooth_time: 0.040
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 30

[tmc2209 extruder]
uart_pin: toolhead:gpio20
run_current: 0.650
stealthchop_threshold: 0

[fan]
pin: toolhead:gpio13

[heater_fan hotend_fan]
pin: toolhead:gpio14
heater: extruder
heater_temp: 50.0

# [fan_generic 4W_FAN0]
# pin: toolhead:gpio15
# tachometer_pin: EBBCan:gpio12
# #tachometer_ppr: 1

[neopixel toolhead_light]
pin: toolhead:gpio16
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 1.0